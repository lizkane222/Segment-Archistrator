version: 0.2

# Mirrors the Render buildCommand in render.yaml: EB's Python platform has no
# Node.js and cannot build the frontend or collect static files itself, so
# CodeBuild does it here and hands EB the already-built artifact.
phases:
  install:
    runtime-versions:
      python: 3.13
      nodejs: 24
  build:
    commands:
      - pip install -r requirements.txt
      # Tests before the build, so a red suite stops the artifact from shipping. Frontend only:
      # the backend suite needs a Postgres, which this project does not provide here.
      - cd frontend && npm ci && npm test -- --run && npm run build && cd ..
      - python manage.py collectstatic --noinput
artifacts:
  files:
    - '**/*'
  exclude-paths:
    - frontend/node_modules/**/*
