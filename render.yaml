# One web service, not two.
#
# `onrender.com` is on the Public Suffix List, so two *.onrender.com services
# cannot share a cookie domain. Since this app's entire auth model is an httpOnly
# session cookie, a split frontend/backend would force SameSite=None third-party
# cookies -- which Safari's ITP and Chrome's third-party cookie restrictions
# break. Serving the built SPA from Django keeps everything same-origin, which
# also means SameSite=Lax works, Django's stock CSRF works, and there is no CORS
# configuration to get wrong.
services:
  - type: web
    name: segment-archistrator
    runtime: python
    plan: starter
    healthCheckPath: /api/health
    buildCommand: |
      pip install -r requirements.txt
      cd frontend && npm ci && npm run build && cd ..
      python manage.py collectstatic --noinput
      python manage.py migrate
      # Not best-effort. Templates come from a fixture in this repo and the
      # command validates them against topology.py, so a failure here means the
      # build is shipping a reference architecture the app itself would reject.
      python manage.py seed_templates
      # Best-effort: the catalog is a nicety, and a Segment outage during a
      # deploy should not fail the deploy. Requires SEGMENT_CATALOG_TOKEN.
      python manage.py sync_catalog || echo "sync_catalog skipped"
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: NODE_VERSION
        value: "24"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DATABASE_URL
        fromDatabase:
          name: segment-archistrator-db
          property: connectionString
      # Fernet key(s) for token encryption at rest. NOT generateValue: Fernet
      # requires exactly 32 url-safe-base64 bytes, and Render's generated
      # secrets are not that shape -- MultiFernet would reject them at boot.
      # Generate and paste one:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      # Rotating means PREPENDING a new key to this comma-separated list, so
      # existing ciphertext stays readable.
      - key: SEGMENT_TOKEN_ENCRYPTION_KEYS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      # Set manually: our own token for reading the global catalog on deploy.
      - key: SEGMENT_CATALOG_TOKEN
        sync: false
      # The feedback form. An Airtable personal access token with `data.records:write` and
      # `schema.bases:read`, plus the base it writes to. Server-side only -- the form posts to this app,
      # which then calls Airtable, because a write-scoped token in a frontend bundle is one anyone with
      # the network tab open can use. Leave unset and the form simply does not appear.
      - key: AIRTABLE_API_KEY
        sync: false
      - key: AIRTABLE_BASE_ID
        sync: false

databases:
  - name: segment-archistrator-db
    plan: basic-256mb
    postgresMajorVersion: "16"
